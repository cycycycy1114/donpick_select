<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DonPick - 手機極速批次上架後台</title>
  <style>
    :root {
      --milk-red: #b85b53;
      --milk-red-dark: #964741;
      --cream-light: #fdfbf7;
      --border-color: #e6dec9;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--cream-light);
      color: #333;
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    h2 {
      color: var(--milk-red);
      margin-top: 0;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
      font-size: 20px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 14px;
    }
    input[type="text"], input[type="datetime-local"], select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .style-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
      background: #faf7f2;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }
    @media(min-width: 600px) {
      .style-row {
        flex-direction: row;
        align-items: center;
      }
    }
    .btn {
      background: var(--milk-red);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }
    .btn:hover {
      background: var(--milk-red-dark);
    }
    .btn-danger {
      background: #d9534f;
      padding: 8px 12px;
    }
    #statusMsg {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      display: none;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>📱 DonPick 手機極速批次上架</h2>

    <!-- 🤖 新增：獨立的 AI 智慧辨識區塊 -->
    <div style="background: #fdf6ec; border: 1px dashed #e6dec9; padding: 14px; border-radius: 8px; margin-bottom: 16px;">
      <label style="color: #b85b53; margin-bottom: 6px;">🤖 AI 智慧解析貨架照 (選填)</label>
      <div style="display: flex; gap: 8px; align-items: center;">
        <input type="file" accept="image/*" id="aiShelfImage" style="display:none;" onchange="handleAiShelfUpload(this)">
        <button type="button" class="btn" style="background: #2eaadc; flex: 1;" onclick="document.getElementById('aiShelfImage').click()">📷 上傳貨架/商品照自動解析</button>
      </div>
      <div id="aiStatus" style="font-size: 12px; color: #666; margin-top: 6px;">上傳後，AI 會自動幫你把商品名稱與價格填入下方表格</div>
    </div>
    <!-- 🤖 獨立區塊結束 -->
    
    <div class="form-group">
      <label>📦 主商品 / 連線名稱</label>
      <input type="text" id="productName" placeholder="例如：9/5-12 日本東京連線">
    </div>

    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
      <div class="form-group" style="flex: 1; min-width: 140px;">
        <label>🏷️ 分類</label>
        <input type="text" id="category" value="日本連線" placeholder="例如：日本連線">
      </div>
      <div class="form-group" style="flex: 1; min-width: 180px;">
        <label>⏰ 收單時間</label>
        <input type="datetime-local" id="deadline">
      </div>
    </div>

    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 16px 0;">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <label style="margin: 0;">✨ 款式清單</label>
      <button type="button" class="btn" onclick="addStyleRow()">➕ 新增一筆</button>
    </div>

    <div id="stylesContainer">
      <!-- 動態插入款式列 -->
    </div>

    <div style="margin-top: 20px; text-align: right;">
      <button type="button" class="btn" style="width: 100%; padding: 14px; font-size: 16px;" onclick="submitBatch()">🚀 一鍵批次寫入 Notion</button>
    </div>

    <div id="statusMsg"></div>
  </div>

  <script>
    window.onload = function() {
      addStyleRow();
    };

    function addStyleRow(styleName = '', price = '', imageUrl = '') {
      const container = document.getElementById('stylesContainer');
      const row = document.createElement('div');
      row.className = 'style-row';
      row.innerHTML = `
        <input type="text" placeholder="編號與名稱" class="styleNameInput" value="${styleName}" style="flex: 2;">
        <input type="number" placeholder="價格" class="priceInput" value="${price}" style="flex: 1;">
        
        <!-- 📷 新增這段檔案上傳與轉網址區塊 -->
        <div style="display: flex; flex-direction: column; flex: 2; gap: 4px;">
          <input type="file" accept="image/*" class="imageFileInput" style="display:none;" onchange="uploadImage(this)">
          <button type="button" class="file-upload-btn" onclick="this.previousElementSibling.click()">📷 選擇相片/拍照</button>
          <input type="text" placeholder="圖片網址 (自動產生)" class="imageUrlInput" value="${imageUrl}" style="font-size: 12px;">
        </div>
      
        <button type="button" class="btn btn-danger" onclick="this.parentElement.remove()">🗑️</button>
      `;
      container.appendChild(row);
    }
    
    async function submitBatch() {
      const productName = document.getElementById('productName').value.trim();
      const category = document.getElementById('category').value.trim();
      const deadline = document.getElementById('deadline').value;
      
      const rows = document.querySelectorAll('.style-row');
      const styles = [];

      rows.forEach(row => {
        const styleName = row.querySelector('.styleNameInput').value.trim();
        const price = row.querySelector('.priceInput').value.trim();
        const imageUrl = row.querySelector('.imageUrlInput').value.trim();

        // 💡 只要有填寫名稱或價格，就算有效，避免被嚴格限制卡住
        if (styleName || price) {
          styles.push({ 
            styleName: styleName || '圖片款', 
            price: Number(price) || 0, 
            imageUrl 
          });
        }
      });

      const msgEl = document.getElementById('statusMsg');

      if (!productName) {
        alert('請填寫主商品名稱！');
        return;
      }
      if (styles.length === 0) {
        alert('請至少填寫一個有效的款式與價格！');
        return;
      }

      msgEl.style.display = 'block';
      msgEl.style.background = '#e6f7ff';
      msgEl.style.color = '#0050b3';
      msgEl.innerText = '⏳ 正在後台批次寫入 Notion，請稍候...';

      try {
        const response = await fetch('/api/batch-create-products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productName, category, deadline, styles })
        });

        const result = await response.json();

        if (result.success) {
          msgEl.style.background = '#f6ffed';
          msgEl.style.color = '#52c41a';
          msgEl.innerText = `🎉 成功！${result.message}`;
          document.getElementById('productName').value = '';
          document.getElementById('stylesContainer').innerHTML = '';
          addStyleRow();
        } else {
          throw new Error(result.error || '未知錯誤');
        }
      } catch (err) {
        msgEl.style.background = '#fff1f0';
        msgEl.style.color = '#ff4d4f';
        msgEl.innerText = `❌ 上架失敗: ${err.message}`;
      }
    }

    // 📷 手機拍照或選相片後，直接轉成 Base64 暫存並填入隱藏/明細欄位
    async function uploadImage(fileInput) {
      const file = fileInput.files[0];
      if (!file) return;

      const urlInput = fileInput.parentElement.querySelector('.imageUrlInput');
      const btn = fileInput.nextElementSibling;
      
      btn.innerText = '⏳ 處理圖片中...';
      btn.style.background = '#faad14';

      const reader = new FileReader();
      reader.readAsDataURL(file);
      
      reader.onload = function() {
        // 直接將完整的 Data URL（或純 Base64）塞進輸入框
        // 後端會自動判斷：如果是 http 就直接用，如果是 Base64 就會自動幫你上傳到 Notion 內建圖床！
        urlInput.value = reader.result; 
        btn.innerText = '✅ 圖片已就緒';
        btn.style.background = '#52c41a';
      };

      reader.onerror = function() {
        alert('圖片讀取失敗');
        btn.innerText = '📷 選擇相片/拍照';
        btn.style.background = '#2eaadc';
      };
    }

// 🤖 帶有自動標號並寫入 Notion 主圖的完整上傳解析函式
async function handleAiShelfUpload(fileInput) {
  const file = fileInput.files[0];
  if (!file) return;

  const statusEl = document.getElementById('aiStatus');
  statusEl.innerText = '⏳ 正在壓縮圖片並透過 AI 快速解析，請稍候...';

  // 1. 圖片壓縮工具函式
  const compressImage = (file, maxWidth = 1024, quality = 0.7) => {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
      };
    });
  };

  // 2. 在圖片上自動繪製 A、B、C 標號的函式
  const drawLabelsOnImage = (file, items) => {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);

          items.forEach((item, index) => {
            const label = String.fromCharCode(65 + index); // A, B, C...
            // 依序排列在左上角的示範座標（可依需求調整位置）
            const x = 60 + (index % 3) * 160;
            const y = 60 + Math.floor(index / 3) * 160;

            // 畫紅色圓圈
            ctx.beginPath();
            ctx.arc(x, y, 35, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgba(255, 0, 0, 0.85)';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = 'white';
            ctx.stroke();

            // 畫白色文字
            ctx.fillStyle = 'white';
            ctx.font = 'bold 36px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, x, y);
          });

          resolve(canvas.toDataURL('image/jpeg', 0.85));
        };
      };
    });
  };

  try {
    const compressedBase64 = await compressImage(file);
    statusEl.innerText = '✨ 圖片壓縮完畢，AI 正在辨識商品與價格...';

    // 3. 呼叫後端 AI 辨識 API
    const aiRes = await fetch('/api/ai-vision-identify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ imageBase64: compressedBase64, mimeType: 'image/jpeg' })
    });
    const aiData = await aiRes.json();

    if (aiData.success && aiData.items && aiData.items.length > 0) {
      statusEl.innerText = '🎨 正在為大合照加上 A、B、C 標號...';
      
      // 4. 產生帶有標號的大合照 Base64
      const labeledBase64 = await drawLabelsOnImage(file, aiData.items);

      // 5. 將標號大合照上傳至你的 Notion 圖片上傳 API（轉換為 Blob 並上傳）
      statusEl.innerText = '📤 正在將標號大合照上傳至 Notion 圖床...';
      const res = await fetch(labeledBase64);
      const blob = await res.blob();
      const formData = new FormData();
      formData.append('file', blob, 'shelf-labeled.jpg');

      const uploadRes = await fetch('/api/upload-image', {
        method: 'POST',
        body: formData
      });
      const uploadData = await uploadRes.json();

      if (uploadData.success && uploadData.url) {
        // 假設你的 Notion 主圖網址輸入框有對應的 ID（例如 mainImageUrl），自動填入
        const mainImgInput = document.getElementById('mainImageUrl'); // 請對應你畫面上主圖網址欄位的 ID
        if (mainImgInput) {
          mainImgInput.value = uploadData.url;
        }
      }

      // 6. 清空下方表格並自動填入 AI 辨識出的品項
      document.getElementById('stylesContainer').innerHTML = '';
      aiData.items.forEach(item => {
        addStyleRow(item.productName, item.price, '');
      });

      statusEl.innerText = `🎉 解析完畢！已自動標號、上傳主圖，並填入 ${aiData.items.length} 個商品。`;
    } else {
      throw new Error(aiData.error || 'AI 未能辨識出商品清單');
    }
  } catch (err) {
    statusEl.innerText = `❌ 處理失敗: ${err.message}，請手動操作。`;
  }
}
  </script>
</body>
</html>
