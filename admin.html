<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DonPick - 手機極速批次上架後台</title>
  <style>
    :root {
      --milk-red: #b85b53;
      --milk-red-dark: #964741;
      --cream-light: #fdfbf7;
      --border-color: #e6dec9;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--cream-light);
      color: #333;
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    h2 {
      color: var(--milk-red);
      margin-top: 0;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
      font-size: 20px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 14px;
    }
    input[type="text"], input[type="datetime-local"], select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .style-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
      background: #faf7f2;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }
    @media(min-width: 600px) {
      .style-row {
        flex-direction: row;
        align-items: center;
      }
    }
    .btn {
      background: var(--milk-red);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }
    .btn:hover {
      background: var(--milk-red-dark);
    }
    .btn-danger {
      background: #d9534f;
      padding: 8px 12px;
    }
    #statusMsg {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      display: none;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>📱 DonPick 手機極速批次上架</h2>
    
    <div class="form-group">
      <label>📦 主商品 / 連線名稱</label>
      <input type="text" id="productName" placeholder="例如：9/5-12 日本東京連線">
    </div>

    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
      <div class="form-group" style="flex: 1; min-width: 140px;">
        <label>🏷️ 分類</label>
        <input type="text" id="category" value="日本連線" placeholder="例如：日本連線">
      </div>
      <div class="form-group" style="flex: 1; min-width: 180px;">
        <label>⏰ 收單時間</label>
        <input type="datetime-local" id="deadline">
      </div>
    </div>

    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 16px 0;">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <label style="margin: 0;">✨ 款式清單</label>
      <button type="button" class="btn" onclick="addStyleRow()">➕ 新增一筆</button>
    </div>

    <div id="stylesContainer">
      <!-- 動態插入款式列 -->
    </div>

    <div style="margin-top: 20px; text-align: right;">
      <button type="button" class="btn" style="width: 100%; padding: 14px; font-size: 16px;" onclick="submitBatch()">🚀 一鍵批次寫入 Notion</button>
    </div>

    <div id="statusMsg"></div>
  </div>

  <script>
    window.onload = function() {
      addStyleRow();
    };

    function addStyleRow(styleName = '', price = '', imageUrl = '') {
      const container = document.getElementById('stylesContainer');
      const row = document.createElement('div');
      row.className = 'style-row';
      row.innerHTML = `
        <input type="text" placeholder="編號與名稱 (例: 38. 零錢包)" class="styleNameInput" value="${styleName}" style="flex: 2;">
        <input type="number" placeholder="價格 (例: 450)" class="priceInput" value="${price}" style="flex: 1;">
        <input type="text" placeholder="圖片網址 (可貼圖檔網址)" class="imageUrlInput" value="${imageUrl}" style="flex: 2;">
        <button type="button" class="btn btn-danger" onclick="this.parentElement.remove()">🗑️ 刪除</button>
      `;
      container.appendChild(row);
    }

    async function submitBatch() {
      const productName = document.getElementById('productName').value.trim();
      const category = document.getElementById('category').value.trim();
      const deadline = document.getElementById('deadline').value;
      
      const rows = document.querySelectorAll('.style-row');
      const styles = [];

      rows.forEach(row => {
        const styleName = row.querySelector('.styleNameInput').value.trim();
        const price = row.querySelector('.priceInput').value.trim();
        const imageUrl = row.querySelector('.imageUrlInput').value.trim();

        if (styleName && price) {
          styles.push({ styleName, price: Number(price), imageUrl });
        }
      });

      const msgEl = document.getElementById('statusMsg');

      if (!productName) {
        alert('請填寫主商品名稱！');
        return;
      }
      if (styles.length === 0) {
        alert('請至少填寫一個有效的款式與價格！');
        return;
      }

      msgEl.style.display = 'block';
      msgEl.style.background = '#e6f7ff';
      msgEl.style.color = '#0050b3';
      msgEl.innerText = '⏳ 正在後台批次寫入 Notion，請稍候...';

      try {
        const response = await fetch('/api/batch-create-products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productName, category, deadline, styles })
        });

        const result = await response.json();

        if (result.success) {
          msgEl.style.background = '#f6ffed';
          msgEl.style.color = '#52c41a';
          msgEl.innerText = `🎉 成功！${result.message}`;
          document.getElementById('productName').value = '';
          document.getElementById('stylesContainer').innerHTML = '';
          addStyleRow();
        } else {
          throw new Error(result.error || '未知錯誤');
        }
      } catch (err) {
        msgEl.style.background = '#fff1f0';
        msgEl.style.color = '#ff4d4f';
        msgEl.innerText = `❌ 上架失敗: ${err.message}`;
      }
    }
  </script>
</body>
</html>
