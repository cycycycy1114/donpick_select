<script>
    let allProducts = [];
    let currentSelectedProduct = null;
    let currentSelectedStyle = null;
    let cart = [];
    let currentCategory = '全部';

    async function loadCatalog() {
      const grid = document.getElementById('productGrid');
      try {
        const res = await fetch('/api/get-products');
        const data = await res.json();
        
        // 🛡️ 雙重防呆解析後端資料
        if (Array.isArray(data)) {
          allProducts = data;
        } else if (data && Array.isArray(data.products)) {
          allProducts = data.products;
        } else {
          allProducts = [];
        }

        if (allProducts.length === 0) {
          grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px;">目前無上架商品</div>';
          return;
        }

        generateSidebarCategories(allProducts);
        renderFilteredProducts();

      } catch (e) {
        console.error("載入失敗:", e);
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: red;">商品載入失敗，請重新整理</div>';
      }
    }

    function generateSidebarCategories(products) {
      const container = document.getElementById('sidebarCategories');
      const allCats = [];
      products.forEach(p => {
        if (p.categories && Array.isArray(p.categories)) {
          p.categories.forEach(c => {
            if (typeof c === 'string' && c.trim() !== '') {
              allCats.push(c.trim());
            }
          });
        }
      });
      
      const uniqueCats = [...new Set(allCats)];
      
      // 🌟 自訂分類順序（新加坡、伴手禮優先）
      const customOrder = ['新加坡', '伴手禮']; 

      uniqueCats.sort((a, b) => {
        let rankA = 999;
        let rankB = 999;

        customOrder.forEach((keyword, idx) => {
          if (a.includes(keyword)) rankA = idx;
          if (b.includes(keyword)) rankB = idx;
        });

        return rankA - rankB;
      });

      const categories = ['全部', ...uniqueCats];
      
      container.innerHTML = '';
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `sidebar-btn ${cat === currentCategory ? 'active' : ''}`;
        btn.innerText = cat;
        btn.onclick = () => filterCategory(cat, btn);
        container.appendChild(btn);
      });
    }

    // 🎯 確保這裡有正確定義 filterCategory 函式
    function filterCategory(category, btnElement) {
      currentCategory = category;
      document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
      renderFilteredProducts();
    }

    function renderFilteredProducts() {
      const grid = document.getElementById('productGrid');
      const filtered = currentCategory === '全部' 
        ? allProducts 
        : allProducts.filter(p => p.categories && p.categories.includes(currentCategory));

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px;">此分類目前無商品</div>';
        return;
      }

      const groupedMap = {};
      filtered.forEach(item => {
        if (!groupedMap[item.productName]) groupedMap[item.productName] = [];
        groupedMap[item.productName].push(item);
      });

      grid.innerHTML = '';
      Object.keys(groupedMap).forEach(productName => {
        const styles = groupedMap[productName];
        const firstStyle = styles[0];
        const minPrice = Math.min(...styles.map(s => s.price || 0));
        const coverImg = firstStyle.imageUrl || '';

        let badgesHtml = `<span class="badge badge-pre">預購</span>`;
        if (firstStyle.needDeposit) {
          badgesHtml += `<span class="badge badge-deposit">需訂金</span>`;
        }

        const imgTag = coverImg 
          ? `<img src="${coverImg}" alt="${productName}">`
          : `<div style="height:180px; background:#eee; display:flex; align-items:center; justify-content:center; color:#999; font-size:12px;">無圖片</div>`;

        const descSnippet = firstStyle.description ? `<div class="product-card-desc">${firstStyle.description}</div>` : '';

        grid.innerHTML += `
          <div class="product-card">
            <div class="badge-container">${badgesHtml}</div>
            ${imgTag}
            <div class="product-card-body">
              <div class="product-card-title">${productName}</div>
              ${descSnippet}
              <div class="product-card-price">$${minPrice} 起</div>
              <button class="product-card-btn" onclick="openModal('${productName}')">選購規格</button>
            </div>
          </div>
        `;
      });
    }

    function openModal(productName) {
      currentSelectedProduct = productName;
      const filtered = currentCategory === '全部' 
        ? allProducts 
        : allProducts.filter(p => p.categories && p.categories.includes(currentCategory));
      
      const matchedStyles = filtered.filter(p => p.productName === productName);
      const sample = matchedStyles[0] || {};
      
      document.getElementById('modalProductName').innerText = productName;
      document.getElementById('modalProductDesc').innerText = sample.description ? `📝 ${sample.description}` : '';
      
      let extraText = '';
      if (sample.deadline) {
        let cleanDate = sample.deadline.replace('T', ' ').substring(0, 16);
        if (cleanDate.length === 10) cleanDate += ' 17:00';
        extraText += `⏰ 收單日期：${cleanDate} `;
      }
      if (sample.needDeposit) {
        extraText += `| 💰 需先付訂金`;
      }
      document.getElementById('modalProductExtra').innerText = extraText;
      document.getElementById('modalQuantity').value = 1;

      const container = document.getElementById('modalStylesContainer');
      container.innerHTML = '';
      currentSelectedStyle = null;

      matchedStyles.forEach((style, idx) => {
        const card = document.createElement('div');
        card.className = 'style-card';
        
        const imgTag = style.imageUrl 
          ? `<img src="${style.imageUrl}">` 
          : `<div style="height:75px; background:#eee; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px; color:#888;">無圖</div>`;

        card.innerHTML = `
          ${imgTag}
          <div style="font-size: 12px; font-weight: bold; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${style.styleName}</div>
          <div style="font-size: 11px; color: #2eaadc;">$${style.price}</div>
        `;

        card.onclick = () => {
          document.querySelectorAll('#modalStylesContainer .style-card').forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
          currentSelectedStyle = style;
          updateModalPrice();
        };

        container.appendChild(card);
        if (idx === 0) card.click();
      });

      document.getElementById('specModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('specModal').style.display = 'none'; }

    function updateModalPrice() {
      const qty = parseInt(document.getElementById('modalQuantity').value) || 1;
      if (currentSelectedStyle) {
        const price = currentSelectedStyle.price || 0;
        document.getElementById('modalUnitPrice').innerText = price;
        document.getElementById('modalSubtotal').innerText = price * qty;
      } else {
        document.getElementById('modalUnitPrice').innerText = '0';
        document.getElementById('modalSubtotal').innerText = '0';
      }
    }

    function addModalItemToCart() {
      if (!currentSelectedProduct || !currentSelectedStyle) {
        alert("請選擇款式規格！");
        return;
      }
      const qty = parseInt(document.getElementById('modalQuantity').value) || 1;

      const existing = cart.find(item => item.product === currentSelectedProduct && item.spec === currentSelectedStyle.styleName);
      if (existing) {
        existing.quantity += qty;
        existing.totalPrice = existing.quantity * existing.price;
      } else {
        cart.push({
          product: currentSelectedProduct,
          spec: currentSelectedStyle.styleName,
          price: currentSelectedStyle.price,
          quantity: qty,
          totalPrice: currentSelectedStyle.price * qty
        });
      }

      renderCart();
      closeModal();
    }

    function renderCart() {
      const container = document.getElementById('cartContainer');
      const cartCountEl = document.getElementById('cartCount');
      const grandTotalEl = document.getElementById('grandTotal');
      const floatCartCount = document.getElementById('floatCartCount');
      const floatGrandTotal = document.getElementById('floatGrandTotal');

      let totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
      let grandTotal = cart.reduce((sum, item) => sum + item.totalPrice, 0);

      floatCartCount.innerText = totalCount;
      floatGrandTotal.innerText = grandTotal;

      if (cart.length === 0) {
        container.innerHTML = '<div style="color: #888; font-size: 13px; text-align: center; padding: 12px;">購物車尚無商品</div>';
        cartCountEl.innerText = '0';
        grandTotalEl.innerText = '0';
        return;
      }

      container.innerHTML = '';
      cart.forEach((item, index) => {
        container.innerHTML += `
          <div class="cart-item">
            <div>
              <strong>${item.product}</strong> <br>
              <span style="color:#666;">規格: ${item.spec} x ${item.quantity}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="color:#2eaadc; font-weight:bold;">$${item.totalPrice}</span>
              <button type="button" class="remove-btn" onclick="removeFromCart(${index})">刪除</button>
            </div>
          </div>
        `;
      });

      cartCountEl.innerText = totalCount;
      grandTotalEl.innerText = grandTotal;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      renderCart();
    }

    function openCheckoutDrawer() {
      if (cart.length === 0) {
        alert("購物車是空的，請先挑選商品加入購物車！");
        return;
      }
      document.getElementById('checkoutDrawer').style.display = 'flex';
    }
    function closeCheckoutDrawer() { document.getElementById('checkoutDrawer').style.display = 'none'; }
    function openQueryDrawer() { document.getElementById('queryDrawer').style.display = 'flex'; }
    function closeQueryDrawer() { document.getElementById('queryDrawer').style.display = 'none'; }

    function closeDrawerOnOutside(event, drawerId) {
      if (event.target.id === drawerId) document.getElementById(drawerId).style.display = 'none';
    }

    async function submitOrder() {
      const nickname = document.getElementById('nickname').value.trim();
      const contactInfo = document.getElementById('contactInfo').value.trim();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('msg');

      if (!nickname || !contactInfo) { alert("請填寫社群暱稱與聯絡資訊！"); return; }
      if (cart.length === 0) { alert("購物車是空的！"); return; }

      btn.disabled = true;
      msg.style.color = '#555';
      msg.innerText = '⏳ 訂單傳送中，請稍候...';

      const data = {
        nickname: nickname,
        contactType: document.getElementById('contactType').value || 'LINE ID',
        contactInfo: contactInfo,
        delivery: document.getElementById('deliverySelect').value,
        items: cart
      };

      try {
        const res = await fetch('/api/create-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          cart = [];
          renderCart();
          msg.style.color = '#333';
          msg.innerHTML = `
            <div style="text-align: center; padding: 14px; background: #fdfdfd; border: 2px dashed #4CAF50; border-radius: 8px; margin-top: 12px;">
              <h3 style="color: #2e7d32; margin-top: 0;">🎉 預購下單成功！</h3>
              <p style="font-size: 13px; font-weight: bold; color: #d32f2f;">📸 請將此畫面截圖私訊 LINE 官方帳號！</p>
            </div>
          `;
        } else {
          const errData = await res.json();
          throw new Error(errData.error || '下單失敗');
        }
      } catch (err) {
        msg.style.color = 'red';
        msg.innerText = '❌ ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    loadCatalog();
  </script>
