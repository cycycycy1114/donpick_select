<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DonPick 懂挑 | 線上預購與選物網站</title>
  <!-- 瀏覽器分頁小圖 -->
  <link rel="icon" type="image/png" href="./Logo.png">
  <style>
    :root {
      --milk-red: #b85b53;       /* 奶茶紅主色 */
      --milk-red-dark: #964741;  /* 奶茶紅 hover 深色 */
      --bg-cream: #f9f6f0;       /* 柔和米白底色 */
      --card-bg: #ffffff;        /* 卡片純白 */
      --cream-light: #f3efe6;    /* 奶茶米色區塊/邊框色 */
      --border-color: #e8e2d5;   /* 邊框色 */
      --text-main: #4a403a;      /* 柔和深色字體 */
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-main);
      margin: 0;
      padding: 0;
    }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 6px rgba(184, 91, 83, 0.03);
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: bold;
      color: var(--milk-red);
    }
    
    .logo-img {
      width: 38px;
      height: 38px;
      object-fit: cover;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: #fff;
    }

    .header-btns {
      display: flex;
      gap: 10px;
    }
    .header-btn {
      background: var(--cream-light);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: bold;
      color: var(--milk-red);
      transition: all 0.2s;
    }
    .header-btn:hover { background: #ebd5cd; }
    
    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 15px;
    }

    /* 公告欄 */
    .announcement-banner {
      background: #fbf5ee;
      border: 1px solid #ebd5cd;
      padding: 14px 18px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
      line-height: 1.6;
      color: #7d403a;
    }

    /* 分類導覽 */
    .category-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    .cat-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      color: #6e625a;
    }
    .cat-btn.active {
      background: var(--milk-red);
      color: white;
      border-color: var(--milk-red);
    }

    /* 商品網格 */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }
    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 6px rgba(74, 64, 58, 0.03);
      transition: transform 0.2s;
    }
    .product-card:hover { transform: translateY(-3px); }
    .product-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background: var(--cream-light);
    }
    .product-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .product-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .product-price {
      color: var(--milk-red);
      font-weight: bold;
      font-size: 15px;
      margin-top: auto;
      margin-bottom: 10px;
    }
    .product-card-btn {
      background: var(--milk-red);
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }
    .product-card-btn:hover { background: var(--milk-red-dark); }

    /* 浮動購物車按鈕 */
    .float-cart-bar {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--milk-red);
      color: white;
      padding: 12px 20px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(184, 91, 83, 0.3);
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 99;
      font-size: 14px;
    }

    /* Modal / Drawer 共用樣式 */
    .modal-overlay, .drawer-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(74, 64, 58, 0.4);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-card {
      background: var(--card-bg);
      width: 90%; max-width: 420px;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-close {
      position: absolute; top: 12px; right: 16px;
      font-size: 20px; cursor: pointer; color: #888;
    }

    /* 款式選擇卡片網格 */
    .styles-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
      max-height: 200px;
      overflow-y: auto;
    }
    .style-card {
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 6px;
      text-align: center;
      cursor: pointer;
      background: var(--cream-light);
    }
    .style-card.selected {
      border-color: var(--milk-red);
      background: #fbf5ee;
    }
    .style-card img {
      width: 100%; height: 60px; object-fit: cover; border-radius: 4px;
    }

    /* 抽屜 (Drawer) 樣式 */
    .drawer {
      display: none;
      position: fixed; top: 0; right: 0; width: 380px; max-width: 100%; height: 100%;
      background: var(--card-bg); box-shadow: -4px 0 20px rgba(0,0,0,0.1);
      z-index: 1001; flex-direction: column;
    }
    .drawer-header { padding: 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; font-weight: bold; background: var(--cream-light); }
    .drawer-body { padding: 16px; flex-grow: 1; overflow-y: auto; }
    .drawer-footer { padding: 16px; border-top: 1px solid var(--border-color); background: var(--cream-light); }
    
    .cart-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--border-color); font-size: 13px;
    }
    .remove-btn { color: #d9534f; border: none; background: none; cursor: pointer; font-size: 12px; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 13px; box-sizing: border-box; background: #fff; }
    
    .submit-btn { background: var(--milk-red); color: white; border: none; width: 100%; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; }
    .submit-btn:hover { background: var(--milk-red-dark); }

    /* Lightbox 預覽大圖 */
    #lightbox {
      display: none; position: fixed; z-index: 2000; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); justify-content: center; align-items: center; cursor: zoom-out;
    }
    #lightbox img { max-width: 90%; max-height: 90%; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
  </style>
</head>
<body>

  <header>
    <div class="logo-area">
      <!-- 🎯 讀取專案根目錄中的 Logo.png -->
      <img src="./Logo.png" alt="Logo" class="logo-img" id="brandLogo" onerror="this.src='https://via.placeholder.com/100x100/b85b53/ffffff?text=DP'">
      <span>DonPick 懂挑</span>
    </div>
    <div class="header-btns">
      <button class="header-btn" onclick="openQueryDrawer()">🔍 已結單查詢</button>
    </div>
  </header>

  <div class="container">
    <!-- 公告欄 -->
    <div class="announcement-banner" id="announcementBanner">
      <div style="font-weight: bold; margin-bottom: 4px;">📢 最新公告：</div>
      <div id="announcementList"></div>
    </div>

    <!-- 分類選單 -->
    <div class="category-bar" id="categoryBar">
      <button class="cat-btn active" onclick="filterCategory('全部', this)">全部商品</button>
    </div>

    <!-- 商品網格 -->
    <div class="product-grid" id="productGrid">
      <div style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px;">⏳ 正在載入商品目錄...</div>
    </div>

    <!-- 放大後的客服與售後專區 -->
    <div style="max-width: 800px; margin: 40px auto; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; box-shadow: 0 4px 12px rgba(74,64,58,0.03); text-align: center; font-size: 15px; line-height: 1.8;">
      <div style="font-size: 18px; font-weight: bold; color: var(--milk-red); margin-bottom: 8px;">
        💬 【訂單客服與售後專區】
      </div>
      <div style="color: #665c55; margin-bottom: 10px;">
        有任何匯款、修改資料、合併寄出或商品問題，歡迎隨時聯絡我們：
      </div>
      <div style="font-weight: bold;">
        👉 LINE 客服：<a href="https://lin.ee/9RRJHKL" target="_blank" style="color: #00b900; text-decoration: none; font-size: 16px;">@122dbekb (點選連結加好友)</a>
      </div>
      <div style="margin-top: 18px; border-top: 1px dashed var(--border-color); padding-top: 16px;">
        <button type="button" onclick="openWishDrawer()" style="background: linear-gradient(135deg, #e8a598, #d87a70); border: none; padding: 10px 24px; border-radius: 20px; font-weight: bold; color: white; cursor: pointer; font-size: 15px; box-shadow: 0 2px 6px rgba(184,91,83,0.15);">
          ✨ 我要許願想買的商品！
        </button>
      </div>
    </div>
  </div>

  <!-- 浮動購物車按鈕 -->
  <div class="float-cart-bar" onclick="openCheckoutDrawer()">
    🛒 購物車 (<span id="floatCartCount">0</span>) | $<span id="floatGrandTotal">0</span>
  </div>

  <!-- 款式選擇 Modal -->
  <div class="modal-overlay" id="specModal" onclick="closeModalOnOutside(event)">
    <div class="modal-card">
      <span class="modal-close" onclick="closeModal()">×</span>
      <h3 id="modalProductName" style="margin-top: 0; font-size: 18px; color: var(--milk-red);">商品名稱</h3>
      <div id="modalProductDesc" style="font-size: 13px; color: #666; margin-bottom: 10px; line-height: 1.5;"></div>
      <div id="modalProductExtra" style="font-size: 13px; font-weight: bold; color: var(--milk-red-dark); margin-bottom: 12px;"></div>
      
      <label style="font-size: 13px; font-weight: bold; display: block; margin-bottom: 4px;">請選擇款式規格：</label>
      <div id="modalStylesContainer" class="styles-grid"></div>

      <div class="form-group" style="margin-top: 14px;">
        <label>購買數量：</label>
        <input type="number" id="modalQuantity" value="1" min="1" oninput="updateModalPrice()">
      </div>

      <div style="font-size: 14px; color: var(--milk-red); margin: 12px 0; font-weight: bold; text-align: right;">
        單價： $<span id="modalUnitPrice">0</span> | 小計：$ <span id="modalSubtotal">0</span>
      </div>

      <button type="button" class="product-card-btn" style="padding: 10px; font-size: 15px;" onclick="addModalItemToCart()">➕ 加入購物車</button>
    </div>
  </div>

  <!-- 結帳抽屜 -->
  <div class="drawer" id="checkoutDrawer">
    <div class="drawer-header">
      <span>🛒 您的購物車清單</span>
      <span style="cursor: pointer; font-size: 18px;" onclick="closeCheckoutDrawer()">×</span>
    </div>
    <div class="drawer-body">
      <div id="cartContainer">
        <div style="color: #888; font-size: 13px; text-align: center; padding: 12px;">購物車尚無商品</div>
      </div>
      <hr style="border:0; border-top:1px solid var(--border-color); margin: 15px 0;">
      
      <div class="form-group">
        <label>社群暱稱 (例如: 小美):</label>
        <input type="text" id="nickname" placeholder="請輸入您的暱稱">
      </div>
      <div class="form-group">
        <label>聯絡方式:</label>
        <div style="display: flex; gap: 6px;">
          <select id="contactType" style="width: 110px;">
            <option value="LINE ID">LINE ID</option>
            <option value="IG 帳號">IG 帳號</option>
            <option value="手機號碼">手機號碼</option>
          </select>
          <input type="text" id="contactInfo" placeholder="請輸入帳號或號碼" style="flex-grow:1;">
        </div>
      </div>
      <div class="form-group">
        <label>取貨方式:</label>
        <select id="deliverySelect">
          <option value="7-11 店到店">7-11 店到店</option>
          <option value="全家店到店">全家店到店</option>
          <option value="郵寄到府">郵寄到府</option>
          <option value="面交自取">面交自取</option>
        </select>
      </div>
      <div class="form-group">
        <label>備註 (選填，如許願或合併單):</label>
        <input type="text" id="orderNote" placeholder="有特殊需求請在此填寫">
      </div>
    </div>
    <div class="drawer-footer">
      <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold;">
        <span>總計：<span id="cartCount">0</span> 項</span>
        <span>總金額：$<span id="grandTotal">0</span></span>
      </div>
      <button type="button" class="submit-btn" id="submitBtn" onclick="submitOrder()">確認送出全部訂單</button>
      <div id="msg" style="margin-top: 8px; text-align: center; font-weight: bold; font-size: 13px;"></div>
    </div>
  </div>

  <!-- 已結單查詢抽屜 -->
  <div class="drawer" id="queryDrawer">
    <div class="drawer-header">
      <span>🔍 查詢您的歷史訂單</span>
      <span style="cursor: pointer; font-size: 18px;" onclick="closeQueryDrawer()">×</span>
    </div>
    <div class="drawer-body">
      <p style="font-size: 12px; color: #666; margin-top: 0;">請輸入您的 **社群暱稱** 或 **聯絡帳號** 來查詢訂單記錄：</p>
      <div style="display: flex; gap: 8px; margin-bottom: 12px;">
        <input type="text" id="queryKeyword" placeholder="例如: 小美 或 id" style="flex-grow: 1; padding: 8px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 13px;">
        <button type="button" onclick="searchOrders()" style="background: var(--milk-red); color: white; border: none; padding: 0 16px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px;">查詢</button>
      </div>
      <div id="queryResultContainer">
        <div style="padding: 20px; text-align: center; color: #888; background: var(--cream-light); border-radius: 8px; font-size: 13px;">尚未輸入查詢條件</div>
      </div>
    </div>
  </div>

  <!-- 許願區 Drawer -->
  <div class="drawer-overlay" id="wishDrawer" onclick="closeDrawerOnOutside(event, 'wishDrawer')">
    <div class="modal-card">
      <span onclick="closeWishDrawer()" class="modal-close">×</span>
      <h3 style="margin-top: 0; color: var(--milk-red); font-size: 18px;">✨ 粉絲專屬許願池</h3>
      <p style="font-size: 13px; color: #666; margin-bottom: 14px;">想找什麼好物嗎？上傳圖片並填寫資訊，老闆幫妳找！</p>
      
      <div class="form-group">
        <label>您的暱稱 / 聯絡帳號：</label>
        <input type="text" id="wishContact" placeholder="例如：小美 (LINE: ccc123)">
      </div>
      <div class="form-group">
        <label>🎯 想許願的商品名稱：</label>
        <input type="text" id="wishProductName" placeholder="例如：限定款餅乾 / 某牌包包">
      </div>
      <div class="form-group">
        <label>📍 購買地點 / 國家：</label>
        <input type="text" id="wishLocation" placeholder="例如：東京車站 / 官網">
      </div>
      <div class="form-group">
        <label>💰 預算範圍 (台幣)：</label>
        <input type="text" id="wishBudget" placeholder="例如：大約 1000 左右">
      </div>
      <div class="form-group">
        <label>📷 上傳參考圖片 (會自動壓縮)：</label>
        <input type="file" id="wishImageFile" accept="image/*" onchange="compressAndPreviewWishImage(this)" style="padding: 4px; font-size: 12px;">
        <div id="wishImagePreviewContainer" style="margin-top: 8px; display: none;">
          <img id="wishImagePreview" style="max-height: 80px; border-radius: 6px; border: 1px solid var(--border-color);">
        </div>
      </div>

      <button type="button" onclick="submitWish()" id="wishSubmitBtn" style="width: 100%; background: var(--milk-red); color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 10px;">送出許願單 🎁</button>
      <div id="wishMsg" style="margin-top: 10px; text-align: center; font-size: 13px; font-weight: bold;"></div>
    </div>
  </div>

  <!-- Lightbox 圖片預覽 -->
  <div id="lightbox" onclick="this.style.display='none'">
    <img id="lightboxImg" src="">
  </div>

  <script>
    let allProducts = [];
    let currentSelectedProduct = null;
    let currentSelectedStyle = null;
    let cart = [];
    let currentCategory = '全部';
    let wishImageBase64 = '';

    async function loadCatalog() {
      const grid = document.getElementById('productGrid');
      try {
        const res = await fetch('/api/get-products');
        const data = await res.json();

        if (data && data.announcements && Array.isArray(data.announcements) && data.announcements.length > 0) {
          const banner = document.getElementById('announcementBanner');
          const listEl = document.getElementById('announcementList');
          listEl.innerHTML = '';
          data.announcements.forEach((annText) => {
            const itemDiv = document.createElement('div');
            itemDiv.style.marginBottom = '4px';
            itemDiv.innerText = '• ' + annText;
            listEl.appendChild(itemDiv);
          });
          banner.style.display = 'block';
        }

        if (data.success && data.products) {
          allProducts = data.products;
          buildCategories();
          renderProducts('全部');
        } else {
          grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px;">目前無上架商品</div>';
        }
      } catch (err) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: red; padding: 40px;">❌ 載入失敗：${err.message}</div>`;
      }
    }

    function buildCategories() {
      const bar = document.getElementById('categoryBar');
      let cats = new Set(['全部']);
      allProducts.forEach(p => {
        if (p.categories && Array.isArray(p.categories)) {
          p.categories.forEach(c => cats.add(c));
        } else if (p.category) {
          cats.add(p.category);
        }
      });
      bar.innerHTML = '';
      cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `cat-btn ${cat === '全部' ? 'active' : ''}`;
        btn.innerText = cat;
        btn.onclick = (e) => filterCategory(cat, e.target);
        bar.appendChild(btn);
      });
    }

    function filterCategory(cat, btnEl) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      renderProducts(cat);
    }

    function renderProducts(cat) {
      const grid = document.getElementById('productGrid');
      const filtered = cat === '全部' ? allProducts : allProducts.filter(p => (p.categories && p.categories.includes(cat)) || p.category === cat);

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px;">此分類目前無商品</div>';
        return;
      }

      const groups = {};
      filtered.forEach(p => {
        if (!groups[p.productName]) {
          groups[p.productName] = p;
        }
      });

      grid.innerHTML = '';
      Object.values(groups).forEach(item => {
        const imgTag = item.imageUrl ? `<img src="${item.imageUrl}">` : `<div style="height:160px; background:#eee; display:flex; align-items:center; justify-content:center; color:#999; font-size:12px;">無圖片</div>`;
        grid.innerHTML += `
          <div class="product-card">
            ${imgTag}
            <div class="product-info">
              <div class="product-title">${item.productName}</div>
              <div class="product-price">NT$ ${item.price} 起</div>
              <button type="button" class="product-card-btn" onclick="openModal('${item.productName}')">選擇規格 / 購買</button>
            </div>
          </div>
        `;
      });
    }

    function openModal(productName) {
      currentSelectedProduct = productName;
      const matchedStyles = allProducts.filter(p => p.productName === productName);
      const sample = matchedStyles[0] || {};

      document.getElementById('modalProductName').innerText = productName;
      document.getElementById('modalProductDesc').innerText = sample.description ? `📝 ${sample.description}` : '';
      
      let extraText = '';
      if (sample.deadline) {
        let cleanDate = sample.deadline.replace('T', ' ').substring(0, 16);
        extraText += `⏰ 收單：${cleanDate}`;
      }
      document.getElementById('modalProductExtra').innerText = extraText;
      document.getElementById('modalQuantity').value = 1;

      const container = document.getElementById('modalStylesContainer');
      container.innerHTML = '';
      currentSelectedStyle = null;

      matchedStyles.forEach((style, idx) => {
        const card = document.createElement('div');
        card.className = 'style-card';
        const imgTag = style.imageUrl ? `<img src="${style.imageUrl}">` : `<div style="height:50px; background:#eee; font-size:10px; display:flex; align-items:center; justify-content:center; color:#888;">無圖</div>`;
        card.innerHTML = `${imgTag}<div style="font-size:11px; font-weight:bold; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${style.styleName}</div><div style="font-size:10px; color:var(--milk-red);">$${style.price}</div>`;
        
        card.onclick = () => {
          document.querySelectorAll('#modalStylesContainer .style-card').forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
          currentSelectedStyle = style;
          updateModalPrice();
        };
        container.appendChild(card);
        if (idx === 0) card.click();
      });

      document.getElementById('specModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('specModal').style.display = 'none'; }
    function closeModalOnOutside(e) { if (e.target.id === 'specModal') closeModal(); }

    function updateModalPrice() {
      const qty = parseInt(document.getElementById('modalQuantity').value) || 1;
      if (currentSelectedStyle) {
        const price = currentSelectedStyle.price || 0;
        document.getElementById('modalUnitPrice').innerText = price;
        document.getElementById('modalSubtotal').innerText = price * qty;
      }
    }

    function addModalItemToCart() {
      if (!currentSelectedProduct || !currentSelectedStyle) {
        alert("請選擇款式規格！");
        return;
      }
      const qty = parseInt(document.getElementById('modalQuantity').value) || 1;
      const existing = cart.find(item => item.product === currentSelectedProduct && item.spec === currentSelectedStyle.styleName);
      
      if (existing) {
        existing.quantity += qty;
        existing.totalPrice = existing.quantity * existing.price;
      } else {
        cart.push({
          product: currentSelectedProduct,
          spec: currentSelectedStyle.styleName,
          price: currentSelectedStyle.price,
          quantity: qty,
          totalPrice: currentSelectedStyle.price * qty,
          imageUrl: currentSelectedStyle.imageUrl || ''
        });
      }
      renderCart();
      closeModal();
    }

    function renderCart() {
      const container = document.getElementById('cartContainer');
      const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
      const grandTotal = cart.reduce((sum, item) => sum + item.totalPrice, 0);

      document.getElementById('floatCartCount').innerText = totalCount;
      document.getElementById('floatGrandTotal').innerText = grandTotal;

      if (cart.length === 0) {
        container.innerHTML = '<div style="color: #888; font-size: 13px; text-align: center; padding: 12px;">購物車尚無商品</div>';
        document.getElementById('cartCount').innerText = '0';
        document.getElementById('grandTotal').innerText = '0';
        return;
      }

      container.innerHTML = '';
      cart.forEach((item, index) => {
        container.innerHTML += `
          <div class="cart-item">
            <div>
              <strong>${item.product}</strong><br>
              <span style="color:#666;">規格: ${item.spec} x ${item.quantity}</span>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="color:var(--milk-red); font-weight:bold;">$${item.totalPrice}</span>
              <button type="button" class="remove-btn" onclick="removeFromCart(${index})">刪除</button>
            </div>
          </div>
        `;
      });
      document.getElementById('cartCount').innerText = totalCount;
      document.getElementById('grandTotal').innerText = grandTotal;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      renderCart();
    }

    function openCheckoutDrawer() {
      if (cart.length === 0) {
        alert("購物車是空的，請先挑選商品！");
        return;
      }
      document.getElementById('checkoutDrawer').style.display = 'flex';
    }
    function closeCheckoutDrawer() { document.getElementById('checkoutDrawer').style.display = 'none'; }

    function openQueryDrawer() { document.getElementById('queryDrawer').style.display = 'flex'; }
    function closeQueryDrawer() { document.getElementById('queryDrawer').style.display = 'none'; }

    function openWishDrawer() { document.getElementById('wishDrawer').style.display = 'flex'; }
    function closeWishDrawer() { document.getElementById('wishDrawer').style.display = 'none'; }
    function closeDrawerOnOutside(e, id) { if (e.target.id === id) document.getElementById(id).style.display = 'none'; }

    async function submitOrder() {
      const nickname = document.getElementById('nickname').value.trim();
      const contactInfo = document.getElementById('contactInfo').value.trim();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('msg');

      if (!nickname || !contactInfo) { alert("請填寫社群暱稱與聯絡資訊！"); return; }
      if (cart.length === 0) { alert("購物車是空的！"); return; }

      btn.disabled = true;
      msg.style.color = '#555';
      msg.innerText = '⏳ 訂單傳送中...';

      const data = {
        nickname,
        contactType: document.getElementById('contactType').value,
        contactInfo,
        delivery: document.getElementById('deliverySelect').value,
        note: document.getElementById('orderNote').value.trim(),
        items: cart
      };

      try {
        const res = await fetch('/api/create-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        if (!result.success) throw new Error(result.error || '送出失敗');

        msg.style.color = '#52c41a';
        msg.innerText = '🎉 訂單送出成功！';
        cart = [];
        renderCart();
        setTimeout(() => {
          closeCheckoutDrawer();
          msg.innerText = '';
          btn.disabled = false;
        }, 1500);
      } catch (err) {
        msg.style.color = '#ff4d4f';
        msg.innerText = '❌ 錯誤：' + err.message;
        btn.disabled = false;
      }
    }

    function maskContact(contact) {
      if (!contact || contact.length <= 4) return '****';
      const start = contact.substring(0, 2);
      const end = contact.substring(contact.length - 2);
      const stars = '*'.repeat(Math.min(contact.length - 4, 6));
      return start + stars + end;
    }

    async function searchOrders() {
      const keyword = document.getElementById('queryKeyword').value.trim();
      const container = document.getElementById('queryResultContainer');

      if (!keyword) { alert("請輸入查詢暱稱或帳號！"); return; }
      container.innerHTML = '<div style="padding: 20px; text-align: center; color: #888; font-size: 13px;">⏳ 正在查詢...</div>';

      try {
        const res = await fetch(`/api/get-orders?keyword=${encodeURIComponent(keyword)}`);
        const data = await res.json();
        if (!data.success) throw new Error(data.error || '查詢失敗');

        const orders = data.orders || [];
        if (orders.length === 0) {
          container.innerHTML = `<div style="padding: 20px; text-align: center; color: #d32f2f; background: #fff5f5; border-radius: 8px; font-size: 13px;">查無符合 「${keyword}」 的訂單記錄。</div>`;
          return;
        }

        let grandTotalAll = 0;
        let totalUnpaidAll = 0;
        orders.forEach(ord => {
          grandTotalAll += (ord.grandTotal || 0);
          totalUnpaidAll += (ord.unpaidTotal || 0);
        });

        let htmlContent = `
          <div style="background: var(--cream-light); border: 1px solid #ebd5cd; padding: 12px 16px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; color: #7d403a; display: flex; justify-content: space-between; align-items: center;">
            <div><strong>📊 買家查詢結算：</strong>共找到 ${orders.length} 筆訂單</div>
            <div style="text-align: right;">
              <span style="margin-right: 12px;">總消費：$${grandTotalAll}</span>
              <span style="color: #d32f2f; font-weight: bold; font-size: 14px;">🔥 總尚未結清：$${totalUnpaidAll}</span>
            </div>
          </div>
          <div style="font-size: 13px; font-weight: bold; margin-bottom: 8px; color: #333;">訂單明細列表：</div>
        `;

        orders.forEach(ord => {
          let itemsHtml = '';
          ord.items.forEach(item => {
            const imgTag = item.imageUrl 
              ? `<img src="${item.imageUrl}" style="width: 36px; height: 36px; object-fit: cover; border-radius: 4px; background: #eee; cursor: zoom-in;" onclick="openLightbox('${item.imageUrl}')">`
              : `<div style="width: 36px; height: 36px; background: #eee; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #999;">無圖</div>`;

            itemsHtml += `
              <div style="display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--border-color);">
                ${imgTag}
                <div style="flex-grow: 1;">
                  <strong>${item.product}</strong><br>
                  <span style="color:#666; font-size:12px;">規格：<span style="color: var(--milk-red); font-weight: bold;">${item.spec}</span> x ${item.quantity}</span>
                </div>
                <div style="color: var(--milk-red); font-weight: bold;">$${item.price}</div>
              </div>
            `;
          });

          htmlContent += `
            <div style="background: white; border: 1px solid var(--border-color); border-radius: 8px; padding: 14px; margin-bottom: 12px; font-size: 13px; line-height: 1.5; box-shadow: 0 2px 6px rgba(0,0,0,0.03);">
              <div style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; margin-bottom: 8px;">
                <span style="font-weight: bold; color: var(--milk-red); font-size: 14px;">👤 ${ord.nickname} (${maskContact(ord.contactInfo)})</span>
                <span style="color: #888; font-size: 12px;">📅 ${ord.createdAt}</span>
              </div>
              <div style="margin-bottom: 8px;"><strong>📦 採購品項明細：</strong><div style="margin-top: 4px;">${itemsHtml}</div></div>
              <div style="display: flex; justify-content: space-between; background: var(--cream-light); padding: 8px; border-radius: 6px; margin-bottom: 6px;">
                <span><strong>💰 該筆總金額：</strong>$${ord.grandTotal}</span>
                <span style="color: #d32f2f; font-weight: bold;">⚠️ 尚未結清：$${ord.unpaidTotal}</span>
              </div>
              <div><strong>取貨方式：</strong>${ord.delivery} | <strong>狀態：</strong><span style="color: #d46b08; font-weight: bold;">[${ord.fulfillmentStatus}]</span> / <span style="color: #52c41a; font-weight: bold;">[${ord.paymentStatus}]</span></div>
              ${ord.note ? `<div style="color: #666; margin-top: 4px;"><strong>📝 備註：</strong>${ord.note}</div>` : ''}
            </div>
          `;
        });
        container.innerHTML = htmlContent;

      } catch (err) {
        container.innerHTML = `<div style="padding: 20px; text-align: center; color: red; font-size: 13px;">❌ 查詢錯誤：${err.message}</div>`;
      }
    }

    // 🎯 自動壓縮圖片並轉為極輕量 Base64 (防止 413 錯誤)
    function compressAndPreviewWishImage(input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      const reader = new FileReader();
      
      reader.onload = function(e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 600; // 限制最大寬度 600px
          const MAX_HEIGHT = 600; // 限制最大高度 600px
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }
          } else {
            if (height > MAX_HEIGHT) {
              width *= MAX_HEIGHT / height;
              height = MAX_HEIGHT;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // 壓縮為 JPEG，品質 0.6 (大幅縮減容量至數十 KB 內)
          wishImageBase64 = canvas.toDataURL('image/jpeg', 0.6);

          document.getElementById('wishImagePreview').src = wishImageBase64;
          document.getElementById('wishImagePreviewContainer').style.display = 'block';
        };
      };
      reader.readAsDataURL(file);
    }

    async function submitWish() {
      const contactInfo = document.getElementById('wishContact').value.trim();
      const productName = document.getElementById('wishProductName').value.trim();
      const location = document.getElementById('wishLocation').value.trim();
      const budget = document.getElementById('wishBudget').value.trim();
      const msgEl = document.getElementById('wishMsg');
      const btn = document.getElementById('wishSubmitBtn');

      if (!productName) { alert("請填寫想許願的商品名稱！"); return; }

      btn.disabled = true;
      msgEl.style.color = '#555';
      msgEl.innerText = '⏳ 正在送出許願單與壓縮圖片...';

      try {
        const res = await fetch('/api/wish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nickname: contactInfo, contactInfo, productName, location, budget, imageUrl: wishImageBase64 })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || '許願失敗');

        msgEl.style.color = '#52c41a';
        msgEl.innerText = '🎉 許願成功！老闆已經收到您的心願與圖片囉！';
        setTimeout(() => {
          closeWishDrawer();
          msgEl.innerText = '';
          btn.disabled = false;
          document.getElementById('wishProductName').value = '';
          document.getElementById('wishLocation').value = '';
          document.getElementById('wishBudget').value = '';
          document.getElementById('wishImageFile').value = '';
          document.getElementById('wishImagePreviewContainer').style.display = 'none';
          wishImageBase64 = '';
        }, 2000);
      } catch (err) {
        msgEl.style.color = '#d32f2f';
        msgEl.innerText = '❌ 錯誤：' + err.message;
        btn.disabled = false;
      }
    }

    function openLightbox(url) {
      document.getElementById('lightboxImg').src = url;
      document.getElementById('lightbox').style.display = 'flex';
    }

    loadCatalog();
  </script>
