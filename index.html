<script>
    let allProducts = [];
    let currentSelectedProduct = null;
    let currentSelectedStyle = null;
    let cart = [];
    let currentCategory = '全部';

    // 確保所有互動函數掛載至全域
    window.filterCategory = function(categoryName, btnEl) {
      currentCategory = categoryName;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      renderProducts(categoryName);
    };

    async function loadVisitorStats() {
      try {
        const res = await fetch('https://api.countapi.xyz/hit/donpick-shop/visits');
        const data = await res.json();
        document.getElementById('visitorCount').innerText = data.value.toLocaleString();
      } catch (e) {
        document.getElementById('visitorCount').innerText = '1,280+';
      }
    }

    async function loadCatalog() {
      const grid = document.getElementById('productGrid');
      try {
        const res = await fetch('/api/get-products');
        const data = await res.json();
        if (data.success) {
          if (data.announcements && data.announcements.length > 0) {
            const banner = document.getElementById('announcementBanner');
            const list = document.getElementById('announcementList');
            list.innerHTML = '';
            data.announcements.forEach((annText) => {
              const itemDiv = document.createElement('div');
              itemDiv.style.paddingLeft = '6px';
              itemDiv.style.borderLeft = '3px solid var(--milk-red)';
              itemDiv.innerText = annText;
              list.appendChild(itemDiv);
            });
            banner.style.display = 'block';
          }

          allProducts = data.products || [];
          buildCategories();
          renderProducts('全部');
        } else {
          grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px;">目前無上架商品</div>';
        }
      } catch (err) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: red;">❌ 載入失敗</div>`;
      }
    }
    
    function buildCategories() {
      const bar = document.getElementById('categoryBar');
      if (!bar) return;

      const rawCats = [];
      allProducts.forEach(p => {
        const s = String(p.saleType || '').trim();
        const cleanS = s.replace(/^[🟢🔴🟡✅❌⛔✔️✖️\s]+/g, '').replace(/[^\w\u4e00-\u9fa5]/g, '').trim();
        const isEndedItem = (cleanS === '已結束' || cleanS === '已結單' || cleanS === '斷貨' || cleanS === '售完' || cleanS === 'false');

        if (!isEndedItem) {
          let catsToProcess = [];
          if (Array.isArray(p.categories)) {
            catsToProcess = p.categories;
          } else if (p.category) {
            catsToProcess = [p.category];
          }

          catsToProcess.forEach(c => {
            if (c && typeof c === 'string' && c.trim() !== '' && c.trim() !== '全部') {
              rawCats.push(c.trim());
            }
          });
        }
      });

      const uniqueRawCats = [...new Set(rawCats)];
      uniqueRawCats.sort((a, b) => a.localeCompare(b, 'zh-Hant', { numeric: true }));

      const categories = ['全部', ...uniqueRawCats, '已結單'];
      
      bar.innerHTML = '';
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `cat-btn ${cat === currentCategory ? 'active' : ''}`;
        
        let displayName = cat;
        if (cat !== '全部' && cat !== '已結單') {
          displayName = cat.replace(/^[\d\s_\-]+/, ''); 
        }

        btn.innerText = displayName;
        btn.onclick = (e) => window.filterCategory(cat, e.target);
        bar.appendChild(btn);
      });
    }
    
    function renderProducts(cat) {
      const grid = document.getElementById('productGrid');
      let filtered = [];

      filtered = allProducts.filter(p => {
        const s = String(p.saleType || '').trim();
        const cleanS = s.replace(/^[🟢🔴🟡✅❌⛔✔️✖️\s]+/g, '').replace(/[^\w\u4e00-\u9fa5]/g, '').trim();
        const isEndedItem = (cleanS === '已結束' || cleanS === '已結單' || cleanS === '斷貨' || cleanS === '售完' || cleanS === 'false');

        if (cat === '已結單') {
          return isEndedItem;
        }

        if (isEndedItem) {
          return false;
        }

        if (cat === '全部') {
          return true;
        }

        if (!p.categories || !Array.isArray(p.categories)) return false;
        return p.categories.some(c => {
          if (!c) return false;
          const trimmedC = String(c).trim();
          const cleanC = trimmedC.replace(/^[\d\s_\-]+/, '');
          return trimmedC === cat || cleanC === cat || cat.includes(cleanC);
        });
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px;">${cat === '已結單' ? '目前沒有已結單的歷史商品' : '此分類目前無商品'}</div>`;
        return;
      }

      const productGroups = {};
      filtered.forEach(p => {
        const name = p.productName || '精選商品';
        if (!productGroups[name]) {
          productGroups[name] = {
            productName: name,
            imageUrl: p.imageUrl || '',
            prices: [],
            saleType: p.saleType,
            deadline: p.deadline,
            needDeposit: p.needDeposit
          };
        }
        if (p.price) productGroups[name].prices.push(p.price);
        if (!productGroups[name].imageUrl && p.imageUrl) {
          productGroups[name].imageUrl = p.imageUrl;
        }
        if (p.deadline) productGroups[name].deadline = p.deadline;
        
        const s = String(p.saleType || '').trim();
        const cleanS = s.replace(/^[🟢🔴🟡✅❌⛔✔️✖️\s]+/g, '').replace(/[^\w\u4e00-\u9fa5]/g, '').trim();
        if (cleanS === '已結束' || cleanS === '已結單' || cleanS === '斷貨' || cleanS === '售完' || cleanS === 'false') {
          productGroups[name].saleType = '已結束';
        } else if (p.saleType && p.saleType !== '預購') {
          productGroups[name].saleType = p.saleType;
        }
        if (p.needDeposit) {
          productGroups[name].needDeposit = true;
        }
      });

      grid.innerHTML = '';
      Object.values(productGroups).forEach(item => {
        const imgTag = item.imageUrl 
          ? `<img src="${item.imageUrl}" onclick="event.stopPropagation(); openLightbox('${item.imageUrl}')">` 
          : `<div style="height:100%; display:flex; align-items:center; justify-content:center; color:#999; font-size:12px;">無圖片</div>`;
        
        let badgesHtml = '';
        let btnText = '選擇規格 / 瀏覽';
        let btnClass = 'product-card-btn';

        const s = String(item.saleType || '').trim();
        const cleanS = s.replace(/^[🟢🔴🟡✅❌⛔✔️✖️\s]+/g, '').replace(/[^\w\u4e00-\u9fa5]/g, '').trim();
        const isEndedCheck = (cleanS === '已結束' || cleanS === '已結單' || cleanS === '斷貨' || cleanS === '售完' || cleanS === 'false');

        if (isEndedCheck) {
          badgesHtml += `<span class="badge badge-ended">已結單</span>`;
          btnText = '🔍 瀏覽歷史紀錄';
          btnClass = 'product-card-btn ended-btn';
        } else {
          if (item.saleType) badgesHtml += `<span class="badge">${item.saleType}</span>`;
          if (item.needDeposit) badgesHtml += `<span class="badge badge-deposit" style="background:#fa8c16; color:#fff; margin-left:4px;">需訂金</span>`;
        }

        let priceText = '價格請點擊內文';
        if (item.prices.length > 0) {
          const minPrice = Math.min(...item.prices);
          const maxPrice = Math.max(...item.prices);
          priceText = minPrice === maxPrice ? `NT$ ${minPrice}` : `NT$ ${minPrice} 起`;
        }

        let deadlineHtml = '';
        if (item.deadline && !isEndedCheck) {
          let cleanDate = item.deadline.replace('T', ' ').substring(0, 16);
          deadlineHtml = `<div style="font-size: 11px; color: #d46b08; margin-bottom: 6px; font-weight: bold;">⏰ 收單：${cleanDate}</div>`;
        }

        grid.innerHTML += `
          <div class="product-card">
            <div class="product-img-wrapper">
              ${imgTag}
              <div class="badges-container">${badgesHtml}</div>
            </div>
            <div class="product-info">
              <div class="product-title">${item.productName}</div>
              ${deadlineHtml}
              <div class="product-price">${priceText}</div>
              <button type="button" class="${btnClass}" onclick="openModal('${item.productName}')">${btnText}</button>
            </div>
          </div>
        `;
      });
    }

    // 掛載其他互動函數至全域
    window.openModal = function(productName) {
      currentSelectedProduct = productName;
      const matchedStyles = allProducts.filter(p => p.productName === productName);
      const sample = matchedStyles[0] || {};
      const s = String(sample.saleType || '').trim();
      const cleanS = s.replace(/^[🟢🔴🟡✅❌⛔✔️✖️\s]+/g, '').replace(/[^\w\u4e00-\u9fa5]/g, '').trim();
      const isEnded = (cleanS === '已結束' || cleanS === '已結單' || cleanS === '斷貨' || cleanS === '售完' || cleanS === 'false');

      document.getElementById('modalProductName').innerText = productName;
      
      let descText = sample.description ? `📝 ${sample.description}` : '';
      if (isEnded) {
        descText = `🔒 【已結單商品】僅供歷史紀錄瀏覽與價格參考，無法加入購物車。 <br>` + descText;
      }
      document.getElementById('modalProductDesc').innerHTML = descText;
      
      let extraText = '';
      if (sample.deadline) {
        let cleanDate = sample.deadline.replace('T', ' ').substring(0, 16);
        extraText += `⏰ 收單：${cleanDate}`;
      }
      document.getElementById('modalProductExtra').innerText = extraText;
      document.getElementById('modalQuantity').value = 1;

      const qtyGroup = document.getElementById('modalQtyGroup');
      const priceSummary = document.getElementById('modalPriceSummary');
      const addToCartBtn = document.getElementById('modalAddToCartBtn');

      if (isEnded) {
        qtyGroup.style.display = 'none';
        priceSummary.style.display = 'none';
        addToCartBtn.style.display = 'none';
      } else {
        qtyGroup.style.display = 'block';
        priceSummary.style.display = 'block';
        addToCartBtn.style.display = 'block';
      }

      const container = document.getElementById('modalStylesContainer');
      container.innerHTML = '';
      currentSelectedStyle = null;

      matchedStyles.forEach((style, idx) => {
        const card = document.createElement('div');
        card.className = 'style-card';
        const imgTag = style.imageUrl 
          ? `<img src="${style.imageUrl}" onclick="event.stopPropagation(); openLightbox('${style.imageUrl}')">` 
          : `<div style="height:60px; background:#eee; font-size:10px; display:flex; align-items:center; justify-content:center;">無圖</div>`;
        
        card.innerHTML = `${imgTag}<div style="font-size:11px; font-weight:bold; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${style.styleName}</div><div style="font-size:10px; color:var(--milk-red);">$${style.price}</div>`;
        
        card.onclick = () => {
          document.querySelectorAll('#modalStylesContainer .style-card').forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
          currentSelectedStyle = style;
          window.updateModalPrice();
        };
        container.appendChild(card);
        if (idx === 0) card.click();
      });

      document.getElementById('specModal').style.display = 'flex';
    };

    window.closeModal = function() { document.getElementById('specModal').style.display = 'none'; };
    window.closeModalOnOutside = function(e) { if (e.target.id === 'specModal') window.closeModal(); };
    
    window.openLightbox = function(url) {
      document.getElementById('lightboxImg').src = url;
      document.getElementById('lightboxModal').style.display = 'flex';
    };
    window.closeLightbox = function() {
      document.getElementById('lightboxModal').style.display = 'none';
    };

    window.updateModalPrice = function() {
      const qty = parseInt(document.getElementById('modalQuantity').value) || 1;
      if (currentSelectedStyle) {
        const price = currentSelectedStyle.price || 0;
        document.getElementById('modalUnitPrice').innerText = price;
        document.getElementById('modalSubtotal').innerText = price * qty;
      }
    };

    window.addModalItemToCart = function() {
      if (!currentSelectedProduct || !currentSelectedStyle) { alert("請選擇款式規格！"); return; }
      const sample = allProducts.find(p => p.productName === currentSelectedProduct);
      const s = String(sample?.saleType || '').trim();
      const cleanS = s.replace(/^[🟢🔴🟡✅❌⛔✔️✖️\s]+/g, '').replace(/[^\w\u4e00-\u9fa5]/g, '').trim();
      if (sample && (cleanS === '已結束' || cleanS === '已結單' || cleanS === '斷貨' || cleanS === '售完' || cleanS === 'false')) {
        alert("此商品已結單，無法加入購物車！");
        return;
      }

      const qty = parseInt(document.getElementById('modalQuantity').value) || 1;
      const existing = cart.find(item => item.product === currentSelectedProduct && item.spec === currentSelectedStyle.styleName);
      
      if (existing) {
        existing.quantity += qty;
        existing.totalPrice = existing.quantity * existing.price;
      } else {
        cart.push({
          product: currentSelectedProduct,
          spec: currentSelectedStyle.styleName,
          price: currentSelectedStyle.price,
          quantity: qty,
          totalPrice: currentSelectedStyle.price * qty,
          imageUrl: currentSelectedStyle.imageUrl || ''
        });
      }
      window.renderCart();
      window.closeModal();
    };

    window.renderCart = function() {
      const container = document.getElementById('cartContainer');
      const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
      const grandTotal = cart.reduce((sum, item) => sum + item.totalPrice, 0);

      document.getElementById('floatCartCount').innerText = totalCount;
      document.getElementById('floatGrandTotal').innerText = grandTotal;

      if (cart.length === 0) {
        container.innerHTML = '<div style="color: #888; font-size: 13px; text-align: center; padding: 12px;">購物車尚無商品</div>';
        document.getElementById('cartCount').innerText = '0';
        document.getElementById('grandTotal').innerText = '0';
        return;
      }

      container.innerHTML = '';
      cart.forEach((item, index) => {
        container.innerHTML += `
          <div class="cart-item">
            <div>
              <strong>${item.product}</strong><br>
              <span style="color:#666;">規格: ${item.spec} x ${item.quantity}</span>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="color:var(--milk-red); font-weight:bold;">$${item.totalPrice}</span>
              <button type="button" class="remove-btn" onclick="window.removeFromCart(${index})">刪除</button>
            </div>
          </div>
        `;
      });
      document.getElementById('cartCount').innerText = totalCount;
      document.getElementById('grandTotal').innerText = grandTotal;
    };

    window.removeFromCart = function(index) { cart.splice(index, 1); window.renderCart(); };
    
    window.openCheckoutDrawer = function() { document.getElementById('checkoutDrawer').style.display = 'flex'; };
    window.closeCheckoutDrawer = function() { document.getElementById('checkoutDrawer').style.display = 'none'; };
    
    window.openQueryDrawer = function() { document.getElementById('queryDrawer').style.display = 'flex'; };
    window.closeQueryDrawer = function() { document.getElementById('queryDrawer').style.display = 'none'; };
    
    window.openWishDrawer = function() { document.getElementById('wishDrawer').style.display = 'flex'; };
    window.closeWishDrawer = function() { document.getElementById('wishDrawer').style.display = 'none'; };
    window.closeDrawerOnOutside = function(e, id) { if (e.target.id === id) document.getElementById(id).style.display = 'none'; };

    window.submitOrder = async function() {
      const nickname = document.getElementById('nickname').value.trim();
      const contactType = document.getElementById('contactType').value;
      const contactInfo = document.getElementById('contactInfo').value.trim();
      const delivery = document.getElementById('deliverySelect').value;
      const note = document.getElementById('orderNote').value.trim();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('msg');

      if (!nickname || !contactInfo) { alert("請填寫社群暱稱與聯絡資訊！"); return; }
      if (cart.length === 0) { alert("購物車是空的！"); return; }

      btn.disabled = true;
      msg.style.color = '#666';
      msg.innerText = '正在送出訂單...';

      try {
        const res = await fetch('/api/create-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nickname, contactType, contactInfo, delivery, note, items: cart })
        });
        const data = await res.json();
        if (data.success) {
          msg.style.color = 'green';
          msg.innerText = '✅ 訂單送出成功！';
          cart = [];
          window.renderCart();
          setTimeout(() => {
            window.closeCheckoutDrawer();
            msg.innerText = '';
            btn.disabled = false;
          }, 1500);
        } else {
          msg.style.color = 'red';
          msg.innerText = '❌ 送出失敗: ' + (data.error || '未知錯誤');
          btn.disabled = false;
        }
      } catch (err) {
        msg.style.color = 'red';
        msg.innerText = '❌ 網路連線錯誤';
        btn.disabled = false;
      }
    };

    window.searchOrders = async function() {
      const keyword = document.getElementById('queryKeyword').value.trim();
      const container = document.getElementById('queryResultContainer');
      if (!keyword) { alert("請輸入查詢暱稱！"); return; }

      container.innerHTML = '<div style="padding: 20px; text-align: center; color: #888;">⏳ 查詢中...</div>';
      try {
        const res = await fetch(`/api/search-orders?keyword=${encodeURIComponent(keyword)}`);
        const data = await res.json();
        if (data.success && data.orders && data.orders.length > 0) {
          let html = '';
          let totalUnpaid = 0;

          data.orders.forEach(ord => {
            totalUnpaid += (ord.unpaidAmount || 0);
            html += `
              <div style="background:#fff; border:1px solid var(--border-color); border-radius:8px; padding:12px; margin-bottom:12px; font-size:13px;">
                <div style="display:flex; justify-content:between; font-weight:bold; color:var(--milk-red); margin-bottom:6px;">
                  <span>訂單編號: ${ord.orderId || 'N/A'}</span>
                  <span>${ord.date || ''}</span>
                </div>
                <div>買家: ${ord.nickname} (${ord.contact})</div>
                <div>取貨: ${ord.delivery}</div>
                <hr style="border:0; border-top:1px dashed #eee; margin:8px 0;">
                <div style="font-weight:bold; margin-bottom:4px;">訂購品項：</div>
            `;
            if (ord.items && Array.isArray(ord.items)) {
              ord.items.forEach(it => {
                html += `<div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span>${it.product} (${it.spec}) x ${it.qty}</span><span>$${it.subtotal}</span></div>`;
              });
            }
            html += `</div>`;
          });

          container.innerHTML = `
            <div style="background:#fbf5ee; border:1px solid #ebd5cd; border-radius:8px; padding:12px; margin-bottom:14px; font-weight:bold; color:#7d403a; text-align:center;">
              💰 總尚未結清金額：NT$ ${totalUnpaid}
            </div>
          ` + html;
        } else {
          container.innerHTML = '<div style="padding: 20px; text-align: center; color: #888;">查無相關訂單紀錄</div>';
        }
      } catch (e) {
        container.innerHTML = '<div style="padding: 20px; text-align: center; color: red;">❌ 查詢發生錯誤</div>';
      }
    };

    window.submitWish = async function() {
      const contact = document.getElementById('wishContact').value.trim();
      const product = document.getElementById('wishProductName').value.trim();
      const location = document.getElementById('wishLocation').value.trim();
      const budget = document.getElementById('wishBudget').value.trim();
      const msg = document.getElementById('wishMsg');
      const btn = document.getElementById('wishSubmitBtn');

      if (!contact || !product) { alert("請填寫聯絡人與想許願的商品！"); return; }

      btn.disabled = true;
      msg.style.color = '#666';
      msg.innerText = '送出中...';

      try {
        const res = await fetch('/api/wish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contact, product, location, budget })
        });
        const data = await res.json();
        if (data.success) {
          msg.style.color = 'green';
          msg.innerText = '🎁 許願成功，已通知管理員！';
          setTimeout(() => {
            window.closeWishDrawer();
            msg.innerText = '';
            btn.disabled = false;
            document.getElementById('wishProductName').value = '';
            document.getElementById('wishLocation').value = '';
            document.getElementById('wishBudget').value = '';
          }, 1500);
        } else {
          msg.style.color = 'red';
          msg.innerText = '❌ 送出失敗';
          btn.disabled = false;
        }
      } catch (e) {
        msg.style.color = 'red';
        msg.innerText = '❌ 網路錯誤';
        btn.disabled = false;
      }
    };

    window.onload = () => {
      loadVisitorStats();
      loadCatalog();
    };
  </script>
